# MoveIt Servo config for UR5e SpaceMouse teleop (decision D3).
# STARTING POINT — verify field names against the moveit_servo (Jazzy) docs and tune
# scales/limits on the workstation. SpaceMouse -> twist -> this servo -> IK -> controller.
moveit_servo:
  # --- command I/O ---
  command_in_type: "speed_units"          # twist in m/s & rad/s (SpaceMouse deflection)
  cartesian_command_in_topic: ~/delta_twist_cmds
  joint_command_in_topic: ~/delta_joint_cmds
  command_out_topic: /scaled_joint_trajectory_controller/joint_trajectory
  command_out_type: trajectory_msgs/JointTrajectory
  status_topic: ~/status
  publish_joint_positions: true
  publish_joint_velocities: false

  # --- frames (UR description) ---
  move_group_name: ur_manipulator
  planning_frame: base_link
  ee_frame: tool0
  robot_link_command_frame: base_link
  joint_topic: /joint_states

  # --- scaling: SpaceMouse full deflection -> robot motion ---
  scale:
    linear: 0.4        # m/s
    rotational: 0.8    # rad/s

  # --- rates / smoothing ---
  publish_period: 0.004        # 250 Hz
  low_pass_filter_coeff: 2.0

  # --- safety: singularity + collision ---
  check_collisions: true
  lower_singularity_threshold: 17.0
  hard_stop_singularity_threshold: 30.0
  self_collision_proximity_threshold: 0.01
  scene_collision_proximity_threshold: 0.02
