; RobotDisco VLA manager (webui/server.py) — datasets / models / evals dashboard.
; Passive and always-wanted, so it autostarts like robot_disco_foxglove_bridge does.
;
; PORT: 8081, not the 8080 in docs/Web-Manager.md. The wildlife `dashboard` program in
; /etc/supervisor/conf.d/dashboard.conf already binds 8080 with autostart=true, so both would race at
; boot and whichever lost would fail to bind. Change here (and in --datasets-dir's sibling docs) if
; you'd rather stop that dashboard and reclaim 8080.
;
; stopasgroup/killasgroup are REQUIRED: server.py spawns the rerun web-viewer as a CHILD process on
; 9090 (webui/viewer.py ensure_app). Without group signalling that child is orphaned on stop/restart
; and then holds 9090, so the next start can't serve the episode player.
[program:vla_webui]
command=/home/bryan/VLA/.venv/bin/python -m webui.server --host 0.0.0.0 --port 8081 --datasets-dir outputs/datasets
directory=/home/bryan/VLA
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/home/bryan/VLA/log/vla_webui.out.log
stderr_logfile=/home/bryan/VLA/log/vla_webui.err.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB
stdout_logfile_backups=2
stderr_logfile_backups=2
environment=HOME="/home/bryan",PYTHONPATH="/home/bryan/VLA",HF_HUB_OFFLINE="1"
user=bryan
