; Robot-PC camera service (scripts/camera_server.py): owns the three USB cameras and multicasts
; JPEG frames to 239.42.11.1:5600, with exposure control on TCP :5601. See
; ur5e_lerobot/sensors/camera_stream.py for the protocol and the reasons.
;
; autostart=true, unlike the robot/inference units: nothing in it moves the robot, and the point is
; that cameras are ALWAYS available — teleop, eval, the ROS bridge and the GPU box attach to this
; instead of fighting over /dev/video*. autorestart=true because a USB hiccup should come back on
; its own (camera_server retries the open for ~60 s at startup to ride out bus enumeration).
;
; Consumers must then run with cameras="udp" (teleop: --cameras udp, eval: --cameras udp). A consumer
; launched with the old local path will fail to open the devices while this is running — that is
; the device exclusivity working as intended; stop this unit if you really need direct access:
;     sudo supervisorctl stop vla_cameras
;
; Exposure persists in this process between consumer launches. To see or set it from anywhere:
;     ~/VLA/run.sh scripts/camera_viewer.py --host 192.168.11.80 --status
;
; Watch the feeds from any machine, no VLA code needed — HTTP MJPEG on :5602 (--http-port):
;     VLC:      File > Open Network  ->  http://192.168.11.80:5602/scene.mjpg   (wrist / side too)
;     browser:  http://192.168.11.80:5602/        (all three on one page)
; These are the exact JPEG bytes the multicast carries — what VLC shows is what the policy sees.
;
; Chunk pacing (--pace-us, default 60) and the sysctl install_services.sh applies (net.core.rmem_max
; = 16 MB) keep three-camera bursts inside subscribers' socket buffers. If a subscriber reports
; drops, check its OWN CPU first — the one real drop case so far was the ROS bridge pinning the GIL
; (fixed in camera_ros_bridge.py), not the network — then `sysctl net.core.rmem_max`.
[program:vla_cameras]
command=/home/rd/VLA/run.sh scripts/camera_server.py --fps 15 --quality 90 --iface-ip 192.168.11.80
directory=/home/rd/VLA
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/home/rd/VLA/log/vla_cameras.out.log
stderr_logfile=/home/rd/VLA/log/vla_cameras.err.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB
stdout_logfile_backups=2
stderr_logfile_backups=2
environment=HOME="/home/rd"
user=rd
