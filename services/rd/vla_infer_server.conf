; Robot-PC-local inference server (scripts/infer_server.py) for when the robot PC has a GPU
; (the Jetson Orin). Same unit as ../vla_infer_server.conf on the GPU box, with rd's paths; read that
; file for the reasoning behind --n-action-steps 8 --prefetch --rtc (measured on hardware; they are
; server-side knobs). Installed by `sudo ./scripts/install_services.sh rd` along with the camera units.
;
; autostart=false: it pins GPU memory and loads a checkpoint; start it when about to drive:
;     sudo supervisorctl start vla_infer_server
; then run the eval client on the same box against loopback (keeps the server/client split, so the
; prefetch/RTC path is identical to the remote-GPU setup):
;     ~/rd_ws/VLA/run.sh scripts/eval_hw.py --remote 127.0.0.1:8777 --cameras udp --fps 12 --video
;
; WHICH CHECKPOINT: the symlink outputs/serve_ckpt, NOT a path baked in here. Checkpoints are trained on
; the GPU box, which is on the robot Wi-Fi (192.168.11.119, since 2026-10-26), so ship pretrained_model
; straight from there (or relay through the workstation if that link is down), then repoint:
;     rsync -a ~/VLA/outputs/train/<run>/capture.json ~/VLA/outputs/train/<run>/checkpoints/<step>/ \
;       rd@192.168.11.80:rd_ws/VLA/outputs/train/<run>/checkpoints/<step>/                 # on the GPU box
;     ssh GPU 'cd VLA/outputs/train && tar cf - <run>/capture.json <run>/checkpoints/<step>/pretrained_model' \
;       | ssh RD 'tar xf - -C rd_ws/VLA/outputs/train'                                  # or, on the workstation
;     ln -sfn ~/rd_ws/VLA/outputs/train/<run>/checkpoints/<step>/pretrained_model ~/rd_ws/VLA/outputs/serve_ckpt
;     sudo supervisorctl restart vla_infer_server
; HF_HUB_OFFLINE=1 because the robot subnet has no internet (lerobot/transformers would hang on DNS);
; the base VLM must already be in ~/.cache/huggingface/hub (rd_ws/provision/jetson/provision_jetson.sh infer).
;
; REACTIVITY ON THE JETSON AGX ORIN (measured 2026-10-11, MAXN, tigger_1_ft/020000):
; a SmolVLA chunk costs ~175 ms of VLM prefix + ~70 ms per denoising step (10 steps -> ~875 ms idle),
; and ~1165 ms median / 2017 ms max during a real eval, when the eval client, three camera decodes
; and the video encoder share the box. The GPU box's n=8 (~120 ms chunks on the 4090) stalls here:
;
;   config (12 fps, 83 ms/step)            cover        real eval result
;   n=8  --prefetch-at 2                   0.17 s       stall ~850 ms every 8th step
;   n=16 --prefetch-at 12                  1.0 s        15 of 15 chunks WAITED (stop-go "in and out")
;   n=24 --prefetch-at 21                  1.75 s       > median compute; rare waits only on the 2 s spikes  <- this unit
;
; Levers that do NOT help here: bf16 autocast (907 ms, launch-bound) and fewer denoising steps only
; at a cost (--num-steps 6: ~600 ms idle but actions drift mean 0.035 / max 0.17 in normalised units).
; Staleness = cover: the policy re-observes every 24 steps (2 s); RTC blends each seam. Since
; 2026-10-11 the server skips the prefetch_at actions that elapsed during compute instead of
; re-playing them (that re-play was a ~200 mm snap-back per chunk here: the "rocking"). Drop --video
; from the eval client to shave load. Re-measure after any checkpoint / camera / power-mode change.
[program:vla_infer_server]
; --also keeps the route's models RESIDENT (one SmolVLA ~1 GB on the 64 GB Orin) so a stage switch is a
; {'cmd':'select'} (<1 s) instead of a repoint-and-restart (~16 s); serve_ckpt is deduped against them.
command=/home/rd/rd_ws/VLA/.venv/bin/python scripts/infer_server.py --ckpt outputs/serve_ckpt --also tigger_1_merged_smolvla_1 --also tigger_bed_1_smolvla --device cuda --port 8777 --n-action-steps 24 --prefetch --rtc --prefetch-at 21
directory=/home/rd/rd_ws/VLA
autostart=false
autorestart=false
stopasgroup=true
killasgroup=true
stdout_logfile=/home/rd/rd_ws/VLA/log/vla_infer_server.out.log
stderr_logfile=/home/rd/rd_ws/VLA/log/vla_infer_server.err.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB
stdout_logfile_backups=2
stderr_logfile_backups=2
environment=HOME="/home/rd",PYTHONPATH="/home/rd/rd_ws/VLA",PYTHONNOUSERSITE="1",HF_HUB_OFFLINE="1"
user=rd
