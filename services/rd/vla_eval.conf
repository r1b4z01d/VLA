; Policy eval as a supervisor unit — MANUAL start. Arguments live in /home/rd/rd_ws/VLA/config/eval.env
; (installed from services/rd/eval.env.example): task, --remote server, fps, video, crop overrides.
;     sudo supervisorctl start vla_eval
; or start it from the manager's Services tab (the Teleop tab only embeds the page). By default the wrapper first makes sure
; vla_infer_server is running (AUTO_INFER=1). `stop` sends SIGTERM = the eval's EXIT: the run is
; closed and uploaded, the UR powered down. Page: http://192.168.11.80:8090/ (eval mode).
; Not at the same time as vla_teleop (see that unit).
[program:vla_eval]
command=/home/rd/rd_ws/VLA/scripts/service_eval.sh
directory=/home/rd/rd_ws/VLA
autostart=false
autorestart=false
stopsignal=TERM
stopwaitsecs=90
stopasgroup=true
killasgroup=true
stdout_logfile=/home/rd/rd_ws/VLA/log/vla_eval.out.log
stderr_logfile=/home/rd/rd_ws/VLA/log/vla_eval.err.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB
stdout_logfile_backups=2
stderr_logfile_backups=2
environment=HOME="/home/rd",USER="rd",DISPLAY=":0",XAUTHORITY="/run/user/1000/gdm/Xauthority",PYTHONPATH="/home/rd/rd_ws/VLA",HF_HUB_OFFLINE="1"
user=rd
