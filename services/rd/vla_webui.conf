; The VLA web manager ON THE ROBOT (same app as ../vla_webui.conf on the GPU box, rd's paths): datasets /
; models / evals from this box's outputs/, the RobotDisco Teleop tab (:8090) and the Routes tab (:8092)
; both local. http://192.168.11.80:8081/ — the GPU box's copy stays the master for training and the
; eval registry; this one keeps the GUI available when the GPU box is off or unreachable.
; Needs fastapi + uvicorn[standard] + python-multipart in ~/VLA/.venv (rd_ws/provision pip lists).
[program:vla_webui]
; The robot / route-editor URLs are loaded by the BROWSER (iframes), so they must be the robot's LAN address,
; never 127.0.0.1 (that would be the viewer's own machine). The server rewrites a loopback host to the
; one the browser used anyway, but be explicit.
command=/home/rd/VLA/.venv/bin/python -m webui.server --host 0.0.0.0 --port 8081 --datasets-dir outputs/datasets --robot-url http://192.168.11.80:8090/ --route-url http://192.168.11.80:8092/
directory=/home/rd/VLA
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/home/rd/VLA/log/vla_webui.out.log
stderr_logfile=/home/rd/VLA/log/vla_webui.err.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB
stdout_logfile_backups=2
stderr_logfile_backups=2
environment=HOME="/home/rd",PYTHONPATH="/home/rd/VLA",PYTHONNOUSERSITE="1",HF_HUB_OFFLINE="1"
user=rd
