; ROS 2 bridge for the camera service: republishes the multicast stream as
;   /vla/cameras/{scene,wrist,side}/image/compressed   (sensor_msgs/CompressedImage, jpeg)
; Add --raw to the command for rgb8 /image topics as well (costs a decode per frame).
;
; Runs under the SYSTEM python with Humble sourced — rclpy is not in the VLA venv — and only imports
; ur5e_lerobot.sensors.camera_stream from the VLA tree (numpy + cv2, both present system-wide).
; Depends on vla_cameras being up; it just waits silently for frames otherwise. ROS_DOMAIN_ID matches
; robot_disco.conf so Foxglove / the rest of the stack see the topics.
;
; PYTHONPATH must APPEND to what setup.bash exported, not replace it: rclpy is found through the ROS
; site-packages entry on PYTHONPATH, so `PYTHONPATH=/home/rd/rd_ws/VLA` alone fails with "No module named
; rclpy" (measured). bash expands $PYTHONPATH at run time, after the source.
[program:vla_camera_ros_bridge]
command=/usr/bin/env bash -lc "source /opt/ros/humble/setup.bash && cd /home/rd/rd_ws/VLA && ROS_DOMAIN_ID=0 PYTHONPATH=/home/rd/rd_ws/VLA:$PYTHONPATH /usr/bin/python3 scripts/camera_ros_bridge.py"
directory=/home/rd/rd_ws/VLA
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/home/rd/rd_ws/VLA/log/vla_camera_ros_bridge.out.log
stderr_logfile=/home/rd/rd_ws/VLA/log/vla_camera_ros_bridge.err.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB
stdout_logfile_backups=2
stderr_logfile_backups=2
environment=HOME="/home/rd",FASTRTPS_DEFAULT_PROFILES_FILE="/home/rd/rd_ws/services/fastdds_no_shm.xml"
user=rd
