; Teleop / recording panel as a supervisor unit — MANUAL start. Arguments live in
; /home/rd/VLA/config/teleop.env (installed from services/rd/teleop.env.example), so the task, dataset
; and crop change without touching this unit: edit the env file, then
;     sudo supervisorctl start vla_teleop
; or press ▶ teleop on the manager's RobotDisco Teleop tab. `stop` sends SIGTERM, which the panel turns
; into its normal Quit: the open episode is dropped, the dataset is finalized (parquet footers), the UR
; is powered down. The page is at http://192.168.11.80:8090/.
; Tk still schedules the control loop even in --ui web, so the unit needs the robot PC's X display:
; DISPLAY/XAUTHORITY below are user rd's GDM autologin session. Only one of vla_teleop / vla_eval can
; run at a time (the SpaceMouse, Stream Deck, UR control script and port 8090 are exclusive; the
; cameras are shared through vla_cameras).
[program:vla_teleop]
command=/home/rd/VLA/scripts/service_teleop.sh
directory=/home/rd/VLA
autostart=false
autorestart=false
stopsignal=TERM
stopwaitsecs=90
stopasgroup=true
killasgroup=true
stdout_logfile=/home/rd/VLA/log/vla_teleop.out.log
stderr_logfile=/home/rd/VLA/log/vla_teleop.err.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB
stdout_logfile_backups=2
stderr_logfile_backups=2
environment=HOME="/home/rd",USER="rd",DISPLAY=":0",XAUTHORITY="/run/user/1000/gdm/Xauthority"
user=rd
