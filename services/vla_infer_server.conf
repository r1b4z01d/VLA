; GPU-box remote-inference server (scripts/infer_server.py) — FALLBACK / experiment host only.
; Since the robot PC became a Jetson Orin (2026-10-10) the production server is
; services/rd/vla_infer_server.conf ON THE ROBOT, with the eval client on the same box against loopback
; (`eval_hw.py --remote 127.0.0.1:8777`). Point a client here (`--remote <GPU_IP>:8777`) only when the
; robot cannot serve itself: the GPU box reaches the robot subnet over Wi-Fi only, which stutters.
;
; autostart=false, like robot_disco/ur5e_driver: it pins ~1.4 GB of VRAM and would sit on the GPU
; during training runs. Bring it up only when you're about to drive the robot:
;     sudo supervisorctl start vla_infer_server
;
; WHICH CHECKPOINT: the symlink outputs/serve_ckpt, NOT a path baked in here — the served checkpoint
; changes far more often than this file should. Repoint and restart:
;     ln -sfn ~/VLA/outputs/train/<run>/checkpoints/last/pretrained_model ~/VLA/outputs/serve_ckpt
;     sudo supervisorctl restart vla_infer_server
; Don't mix checkpoints trained on different observation geometry — the client's cameras.py must match
; what the checkpoint was trained on.
;
; --n-action-steps is the reactivity knob and it lives HERE (server-side), not on the client. 8 is what
; the working rollouts used; 1 re-plans every frame and measured ~104 ms/call, which overruns the loop.
;
; --prefetch --rtc is the configuration measured best on hardware over a wired link at 12 fps. Seam =
; the commanded step at a chunk boundary vs mid-chunk (jerk you can feel); loop p90 = timing spikes:
;
;   config                    seam    ratio   jerk p90   loop p90   clamps
;   n=8 (select_action)      15.2mm    2.5x     11.9mm      180ms      2
;   n=16                     16.2mm    1.7x     12.4mm      166ms      2
;   n=8 --prefetch           26-46mm   3.5-4.5x 22-45mm      87ms     0-8
;   n=8 --prefetch --rtc      8.8mm    1.3x      7.9mm       87ms      0
;
; Prefetch alone removes the ~124 ms re-plan spike but computes the next chunk from a 2-step-old
; observation, which makes the seam WORSE (~+10 mm per step of staleness). RTC guides the new chunk
; onto the outgoing chunk's unplayed tail, fixing the seam it introduces — the pair is better than
; either alone, and better than no prefetch at all. RTC costs ~16 ms/chunk (108 -> 124 ms median),
; which hides inside the prefetch margin.
;
; If you ever see a hitch: chunk compute has a ~354 ms cold outlier against ~166 ms of cover at
; --prefetch-at 2; raise to --prefetch-at 3 for ~250 ms.
; EXPERIMENT 2026-10-12: n-action-steps 4, NO prefetch/RTC — re-observe every 4 steps (0.33 s) to test
; reaction to a moved object. The table above says this costs a ~124 ms inline re-plan every 4th
; step; revert to `--n-action-steps 8 --prefetch --rtc --rtc-execution-horizon 3` if it stutters.
[program:vla_infer_server]
command=/home/bryan/VLA/.venv/bin/python scripts/infer_server.py --ckpt outputs/serve_ckpt --device cuda --port 8777 --n-action-steps 4
directory=/home/bryan/VLA
autostart=false
autorestart=false
stopasgroup=true
killasgroup=true
stdout_logfile=/home/bryan/VLA/log/vla_infer_server.out.log
stderr_logfile=/home/bryan/VLA/log/vla_infer_server.err.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB
stdout_logfile_backups=2
stderr_logfile_backups=2
environment=HOME="/home/bryan",PYTHONPATH="/home/bryan/VLA",HF_HUB_OFFLINE="1"
user=bryan
